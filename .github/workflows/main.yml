- name: ⚙️ 检查网站状态并生成报告 (使用安全分隔符)
        id: check
        run: |
          # 定义一个安全的、唯一的自定义分隔符
          DELIMITER="REPORT_END_DELIMITER_987654321"

          # 1. 计算当前时间
          current_utc_time=$(date "+%Y-%m-%d %H:%M:%S")
          current_china_time=$(date -d "$current_utc_time UTC+8 hours" "+%Y-%m-%d %H:%M:%S")
          
          # 2. 初始化报告头
          initial_report="<b>📊 网站状态报告</b>\n\n<b>📅 检查时间:</b> ${current_china_time}\n\n"
          
          # 3. 使用安全分隔符开始写入 GITHUB_OUTPUT
          echo "report<<$DELIMITER" >> $GITHUB_OUTPUT
          
          (
            report="$initial_report" # 在子 Shell 中初始化报告
            
            printf '%s' "$WEBSITES" | jq -c 'sort_by(.name) | .[]' | while read -r website; do
              
              website_name=$(jq -r '.name' <<< "$website")
              website_url=$(jq -r '.url' <<< "$website")
              
              status_code=$(curl -L -o /dev/null -s -w "%{http_code}" "$website_url")
              
              if [ "$status_code" -eq 200 ]; then
                status="✅ 正常"
              else
                status="❌ 异常"
              fi
              
              result="${website_name}： <a href='${website_url}'>${website_url}</a>\n  状态: ${status} (状态码: ${status_code})\n\n"
              
              printf '%s' "$result" >&2 
              
              report="${report}${result}"
            done
            
            # 最终将完整的报告打印到标准输出
            printf '%s' "$report"
            
          ) >> $GITHUB_OUTPUT
          
          # 使用安全分隔符结束写入 GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT
