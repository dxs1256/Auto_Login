name: 网站状态定时检查

on:
  workflow_dispatch: # 保留手动触发选项
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次

env:
  WEBSITES: |
    [
      {"name": "MoonTV", "url": "https://dxs1256.zeabur.app"},
      {"name": "我的博客", "url": "https://situ.eu.org"},
      {"name": "Alist", "url": "https://vzlvvpql.ap-northeast-1.clawcloudrun.com"},
      {"name": "OpenWrt", "url": "http://op.situ.eu.org"},
      {"name": "OpenList", "url": "http://dav.situ.eu.org"}
    ]
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}  # 👈 新增：企业微信 webhook

jobs:
  check-websites:
    runs-on: ubuntu-latest
    
    steps:
      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 检查网站状态
        id: check
        run: |
          websites=$(echo "$WEBSITES" | jq -c 'sort_by(.name) | .[]')
          current_utc_time=$(date "+%Y-%m-%d %H:%M:%S")
          current_china_time=$(date -d "$current_utc_time UTC +8 hours" "+%Y-%m-%d %H:%M:%S")

          # 构建 HTML 报告（用于 Telegram）
          html_report="<b>📊 网站状态报告</b>\n\n<b>📅 检查时间:</b> ${current_china_time}\n\n"
          
          # 构建 Markdown 报告（用于企业微信）
          md_report="## 📊 网站状态报告\n\n**📅 检查时间：** ${current_china_time}\n\n"

          for website in $websites; do
            name=$(echo "$website" | jq -r '.name')
            url=$(echo "$website" | jq -r '.url')
            status_code=$(curl -L -m 1 -o /dev/null -s -w "%{http_code}" "$url" || echo "000")
            
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              status="✅ 正常"
              md_status="✅ 正常"
            else
              status="❌ 异常"
              md_status="❌ 异常"
            fi

            # HTML (Telegram)
            html_report+="${name}： <a href='${url}'>${url}</a>\n    状态: ${status} (状态码: ${status_code})\n\n"
            
            # Markdown (企业微信)
            md_report+="> **${name}**\n> [${url}](${url})\n> 状态：${md_status} （${status_code}）\n\n"
          done

          # 输出到 GitHub Actions 输出
          echo "html_report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$html_report" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "md_report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$md_report" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 发送报告到 Telegram
        if: env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          report="${{ steps.check.outputs.html_report }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TG_CHAT_ID}\", \"text\": \"${report}\", \"parse_mode\": \"HTML\", \"disable_web_page_preview\": true}"

      - name: 发送报告到企业微信（Markdown）
        if: env.WECOM_WEBHOOK != ''
        run: |
          md_content="${{ steps.check.outputs.md_report }}"
          
          # 截断至 4096 字节（UTF-8）
          encoded_bytes=$(echo -n "$md_content" | wc -c)
          if [ "$encoded_bytes" -gt 4096 ]; then
            md_content=$(echo "$md_content" | head -c 4000)
            md_content="$md_content\n\n⚠️ 内容过长，已截断…"
          fi

          payload=$(jq -n \
            --arg msgtype "markdown" \
            --arg content "$md_content" \
            '{"msgtype": $msgtype, "markdown": {"content": $content}, "mentioned_list": ["@all"]}'
          )

          echo "📤 准备发送企业微信通知（Markdown，长度: ${#md_content} 字符）"
          echo "$payload" | jq .

          resp=$(curl -s -X POST "${WECOM_WEBHOOK}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")

          echo "📡 企业微信响应: $resp"
          if echo "$resp" | jq -e '.errcode == 0' >/dev/null 2>&1; then
            echo "✅ 企业微信通知发送成功"
          else
            echo "⚠️ Markdown 发送失败，尝试 fallback 为 text 类型..."
            
            # fallback to text
            text_content=$(echo "$md_content" | sed 's/\*\*//g; s/## //g; s/> //g; s/\[//g; s/](.*)//g')
            if [ $(echo -n "$text_content" | wc -c) -gt 2048 ]; then
              text_content=$(echo "$text_content" | head -c 2000)
              text_content="$text_content\n⚠️ 内容过长，已截断"
            fi

            payload_text=$(jq -n \
              --arg msgtype "text" \
              --arg content "$text_content" \
              '{"msgtype": $msgtype, "text": {"content": $content, "mentioned_list": ["@all"]}}'
            )

            resp2=$(curl -s -X POST "${WECOM_WEBHOOK}" \
              -H "Content-Type: application/json" \
              -d "$payload_text")
            echo "📡 Text 模式响应: $resp2"
            if echo "$resp2" | jq -e '.errcode == 0' >/dev/null 2>&1; then
              echo "✅ 企业微信（text 模式）通知发送成功"
            else
              echo "❌ 企业微信通知彻底失败"
              exit 1
            fi
          fi

      - name: 显示报告（调试用）
        run: |
          echo "=== Telegram HTML 报告 ==="
          echo "${{ steps.check.outputs.html_report }}"
          echo
          echo "=== 企业微信 Markdown 报告 ==="
          echo "${{ steps.check.outputs.md_report }}"
