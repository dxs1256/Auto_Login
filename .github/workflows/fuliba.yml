name: 福利吧自动签到通知

on:
  schedule:
    # cron表达式说明：
    # `0 0 2,6 * * *` 表示在每天的 UTC 时间 2点和 6点（即北京时间早上10点和下午2点）各运行一次。
    # 根据你的cron注释 `0 0 2,6 * * *`，这是每小时的0分0秒在每天的2点和6点。
    # 如果你想改成早上8点运行一次，可以这样设置：
    # - cron: '0 0 0 * * *' # 每天 UTC 0点运行 (即北京时间早上8点)
    # 如果你想改成你的注释 `每天2点和6点签到一次`，且你的服务器是UTC时间，就是 `0 0 2,6 * * *`
    # 如果你的服务器是东八区，你想每天北京时间2点和6点，那么需要根据UTC时间减去8小时。
    # 比如北京时间2点是UTC-8小时，即UTC 18点。
    # 比如北京时间6点是UTC-8小时，即UTC 22点。
    - cron: '0 0 18,22 * * *' # 每天 北京时间 2点和6点 运行

  workflow_dispatch: # 允许手动触发工作流

jobs:
  run_fuba_checkin:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境

    steps:
      - name: Checkout repository # 步骤1: 检出代码
        uses: actions/checkout@v4

      - name: Set up Python # 步骤2: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 指定 Python 版本，建议使用较新的稳定版本

      - name: Install dependencies # 步骤3: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run 福利吧签到脚本 # 步骤4: 运行你的 Python 脚本
        env:
          # 从 GitHub Secrets 中获取 Telegram 配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 从 GitHub Secrets 中获取福利吧账号信息
          FUBA: ${{ secrets.FUBA }}
          FUBAUN: ${{ secrets.FUBAUN }}
        run: python fuba_checkin.py # 运行你的脚本文件
