name: 福利吧每日自动签到

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（必须加 pysocks！）
        run: |
          pip install requests urllib3 pysocks   # ← 这行是救命稻草

      - name: 执行福利吧签到
        env:
          WNFLB_USERS: ${{ secrets.WNFLB_USERS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python fuliba.py

      - name: Telegram 通知
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
               -d chat_id=${{ secrets.TG_CHAT_ID }} \
               -d text="福利吧签到任务已完成（$(date '+%Y-%m-%d %H:%M') 北京时间）"
