name: 福利吧每日自动签到

on:
  schedule:
    - cron: '0 1 * * *'      # UTC 1:00 = 北京时间 9:00
  workflow_dispatch:       # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 执行福利吧签到
        env:
          # 推荐方式：多账号一行搞定（强烈建议用这个）
          WNFLB_USERS: ${{ secrets.WNFLB_USERS }}   # 格式：user1:pass1|||user2:pass2

          # 如果你只用单账号，可以用下面两个（随便选一种就行）
          # WNFLB_USERNAME: ${{ secrets.WNFLB_USERNAME }}
          # WNFLB_PASSWORD: ${{ secrets.WNFLB_PASSWORD }}
        run: |
          python fuliba.py

      - name: 发送 Telegram 通知（可选）
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
               -d chat_id=${{ secrets.TG_CHAT_ID }} \
               -d text="福利吧签到任务已完成（$(date '+%Y-%m-%d %H:%M') 北京时间）"
