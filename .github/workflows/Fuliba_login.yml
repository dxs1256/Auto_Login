name: 福利吧自动签到

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（必须加 pysocks！）
        run: |
          pip install requests urllib3 pysocks   # ← 这行是救命稻草

      - name: 执行福利吧签到
        env:
          WNFLB_USERS: ${{ secrets.WNFLB_USERS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
        run: |
          python fuliba.py
