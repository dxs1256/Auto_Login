name: 福利吧每日签到

on:
  schedule:
    - cron: '0 8 * * *'     # 每天 UTC 0点 = 北京时间 16点签到，可改成 '30 22 * * *' 就是北京6:30
  workflow_dispatch:        # 支持手动点 Run 触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install axios got querystring

      - name: 运行福利吧签到（仅 Telegram 通知）
        env:
          FULI_COOKIE: ${{ secrets.FULI_COOKIE }}        # 多账号用 @ 分割
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}          # 注意：很多教程写 TG_USER_ID，福利吧脚本里变量名是 TG_CHAT_ID 才认！
        run: node fulibasign.js
