name: 福利吧自动签到

on:
  schedule:
    # 每天 UTC 16点和 22点 运行 (对应北京时间 0点和 6点)
    # Cron 表达式字段：分钟 小时 日期 月份 星期
    # '1 16 * * *' 表示每天 UTC 16:00 (北京时间 00:01)
    # '0 22 * * *' 表示每天 UTC 22:00 (北京时间 06:00)
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

  workflow_dispatch: # 允许手动触发工作流

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Run Check-in Script
      # 使用 env: 块将 Secrets 注入到脚本的环境变量中
      env:
        FUBA: ${{ secrets.FUBA }}
        FUBAUN: ${{ secrets.FUBAUN }}
      run: python fuliba.py
