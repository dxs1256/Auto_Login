name: 每日自动签到 (带SOCKS5代理)

on:
  # 设定每日定时运行的时间，例如 UTC 00:00 (北京时间早上 8 点)
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 设置超时时间，避免代理连接慢导致长时间等待

    steps:
    - name: 1. 检出代码 (Checkout Repository)
      uses: actions/checkout@v4

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 3. 安装依赖 (包括 SOCKS5 支持)
      run: |
        # 必须安装 requests[socks] 依赖，以支持 SOCKS5 代理
        pip install requests requests[socks]

    - name: 4. 运行自动签到脚本
      # 将 Secrets 注入到 Python 脚本的环境变量中
      env:
        FUBA: ${{ secrets.FUBA }}             # 您的登录 Cookie
        FUBAUN: ${{ secrets.FUBAUN }}         # 您的账号名 (用于日志)
        SOCKS5_PROXY_URL: ${{ secrets.SOCKS5_PROXY_URL }} # 🚨 SOCKS5 代理地址
      run: python 你的脚本文件名.py
