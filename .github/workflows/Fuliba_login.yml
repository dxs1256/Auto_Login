name: 福利吧签到

on:
  schedule:
    - cron: '0 8 * * *'     # 北京时间 16:00
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 axios
        run: npm install axios

      - name: 执行签到（已内置 TG 通知）
        env:
          FULI_COOKIE: ${{ secrets.FULI_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node fuliba.js
