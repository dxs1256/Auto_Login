name: 福利吧自动签到通知

on:
  schedule:
    # 每天 UTC 18点和 22点 运行 (对应北京时间 2点和 6点)
    # Cron 表达式字段：分钟 小时 日期 月份 星期
    # '0 18 * * *' 表示每天 UTC 18:00 (北京时间 02:00)
    # '0 22 * * *' 表示每天 UTC 22:00 (北京时间 06:00)
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

  workflow_dispatch: # 允许手动触发工作流

jobs:
  run_fuba_checkin:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境

    steps:
      - name: Checkout repository # 步骤1: 检出代码
        uses: actions/checkout@v4

      - name: Set up Python # 步骤2: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 指定 Python 版本，建议使用较新的稳定版本

      - name: Install dependencies # 步骤3: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run 福利吧签到脚本 # 步骤4: 运行你的 Python 脚本
        env:
          # 从 GitHub Secrets 中获取 Telegram 配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 从 GitHub Secrets 中获取福利吧账号信息
          FUBA: ${{ secrets.FUBA }}
          FUBAUN: ${{ secrets.FUBAUN }}
        run: python fuba_checkin.py # 运行你的脚本文件
