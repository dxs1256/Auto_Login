name: Loomi 每日签到

on:
  schedule:
    - cron: '0 16 * * *'     # 北京时间 00:00（UTC时间往前减8小时）
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 安装依赖
      run: |
        pip install --upgrade pip
        pip install requests

    - name: 🚀 执行签到 + 通知
      env:
        LOOMI_EMAIL: ${{ secrets.LOOMI_EMAIL }}
        LOOMI_PASSWORD: ${{ secrets.LOOMI_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        LOOMI_REFRESH_TOKEN: ${{ secrets.LOOMI_REFRESH_TOKEN }}
      run: python loomi.py  # 👈 修改这里！

    - name: 📊 保存完整报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: loomi-report-${{ github.run_number }}
        path: |
          credits_report.txt
          loomi.log
        retention-days: 30
