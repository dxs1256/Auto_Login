name: 🌅 Loomi 每日签到

on:
  schedule:
    # 每天 UTC 1:00 (北京时间 09:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 安装依赖  # ← 这里修复了！
      run: |
        pip install --upgrade pip
        pip install requests schedule  # ← 添加 schedule

    - name: 🚀 执行签到
      env:
        LOOMI_EMAIL: ${{ secrets.LOOMI_EMAIL }}
        LOOMI_PASSWORD: ${{ secrets.LOOMI_PASSWORD }}
      run: python loomi_pro.py

    - name: 📝 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: loomi-logs-${{ github.run_number }}
        path: |
          loomi.log
          tokens.json
        retention-days: 30
