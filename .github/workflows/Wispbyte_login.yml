name: Wispbyte 保活

on:
  schedule:
    - cron: '0 2 * * *'      # 每天运行一次
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 下面这行是修复报错的关键：同时安装 requests 和 pysocks
          pip install requests pysocks

      - name: 执行保活
        env:
          # 必须在这里把 Secrets 映射给 Python 环境变量
          WISPBYTE_COOKIE_STRING: ${{ secrets.WISPBYTE_COOKIE_STRING }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}   # <--- 新增这行
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}       # <--- 新增这行
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}  # 👈 必须加上这一行
        run: python -u wispbyte.py

      - name: Telegram 报警
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Wispbyte 保活失败！请检查 GitHub Actions 日志。"
