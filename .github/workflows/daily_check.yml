name: sunset-check

# 火烧云监控：定时查询 sunsetbot.top 并推送通知，状态文件提交回仓库持久化（方案 B）
# 部署位置：仓库根目录（daily_check.js 在根目录，本文件为 .github/workflows/daily_check.yml）
on:
  schedule:
    # cron 为 UTC。50 9,40 10,20 11 * * * = 北京时间 17:50 / 18:40 / 19:20
    # 三次运行覆盖落日窗口，趋势（上升/下降）才有足够采样
    - cron: '50 9 * * *'
    - cron: '40 10 * * *'
    - cron: '20 11 * * *'
  workflow_dispatch: {} # 支持手动触发（首次部署验证用）

# 方案 B 需要 contents: write 才能提交 state.json 回仓库
permissions:
  contents: write

# 防止相邻两次运行重叠导致重复推送 / git push 冲突：
# 排队等待而不是取消（取消会漏掉一整次检查）
concurrency:
  group: sunset-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 防止卡死的运行烧掉时长
    steps:
      - uses: actions/checkout@v4 # 默认 persist-credentials: true，后续可直接 push

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 仓库根目录的 package.json 没有 package-lock.json，这里禁用缓存
          # 如需启用：先本地生成 package-lock.json 提交上去，再改回 cache: npm
          # cache-dependency-path: package-lock.json

      - name: 安装依赖
        env:
          # 根 package.json 里的 playwright 装运会拖浏览器下载，本脚本用不到，跳过
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # --no-save --no-package-lock：不改动 package.json / 不生成 lock 文件，
        # 保持工作区干净，避免影响后面 git pull --rebase
        run: npm install axios --no-save --no-package-lock --no-audit --no-fund

      - name: 运行监控脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 城市名从 Secrets 读取（已确认用户配置在 Secrets）；未配置时脚本用默认值十堰-茅箭区
          SUNSET_CITY: ${{ secrets.SUNSET_CITY }}
        run: node daily_check.js

      # 方案 B：把状态文件提交回仓库，趋势与去重跨运行生效
      # if: always()：脚本部分失败（退出码 1）时也要把已写入的观测值提交回去，
      # 否则下次运行会基于旧基线算趋势
      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout 的 HEAD 是游离的，先建立本地分支引用再拉取远端
          git checkout ${GITHUB_REF_NAME} 2>/dev/null || git checkout -B ${GITHUB_REF_NAME} origin/${GITHUB_REF_NAME}
          git pull --rebase origin ${GITHUB_REF_NAME}
          git add state.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新火烧云监控状态 [skip ci]"
            # push 失败（如并发冲突）重试一次；仍失败则让任务变红，状态丢失不静默
            git push origin HEAD:${GITHUB_REF_NAME} || {
              echo "push 失败，rebase 后重试一次"
              git pull --rebase origin ${GITHUB_REF_NAME}
              git push origin HEAD:${GITHUB_REF_NAME}
            }
          fi
