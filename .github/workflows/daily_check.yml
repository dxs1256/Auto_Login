name: 火烧云监控

on:
  schedule:
    # 每天北京时间 14:00 (UTC 6:00) 和 17:00 (UTC 9:00) 运行
    - cron: '0 6,9 * * *'
  workflow_dispatch:

jobs:
  check-sunset:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm install axios

      - name: 运行监控脚本
        env:
          # ⚠️ 这里改成 WX_WEBHOOK_URL
          WX_WEBHOOK_URL: ${{ secrets.WX_WEBHOOK_URL }}
          SUNSET_CITY: ${{ secrets.SUNSET_CITY }}
          SUNSET_THRESHOLD: '0.5'
        run: node sunset_monitor.js
