name: 火烧云监控

on:
  schedule:
    # 北京时间 12:00 (UTC 4) 和 20:00 (UTC 12)
    - cron: '0 4,12 * * *'
  workflow_dispatch:

jobs:
  check-sunset:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm install axios

      - name: 运行监控
        env:
          # 城市设置
          SUNSET_CITY: ${{ secrets.SUNSET_CITY }}
          SUNSET_THRESHOLD: '0.5'
          
          # PushPlus 配置
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          
          # Telegram 配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          
        run: node daily_check.js
