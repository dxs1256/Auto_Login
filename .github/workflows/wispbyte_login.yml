name: Wispbyte 永久保活（2025最终版）

on:
  schedule:
    - cron: '0 */4 * * *'      # 每4小时一次
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 关键修复：Ubuntu 24.04 兼容的 Chromium 安装方式
      - name: 安装 Chromium 和正确依赖（Ubuntu 24.04 专用）
        run: |
          sudo apt update -y
          sudo apt install -y chromium-browser libasound2t64 libgbm1 libnss3 libxss1 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libatspi2.0-0 libxcomposite1 libxdamage1 fonts-liberation

      # 安装 Python 依赖
      - name: 安装 Python 包
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests beautifulsoup4

      # 执行保活脚本
      - name: 执行 Wispbyte 自动登录保活
        env:
          WISPBYTE_EMAIL: ${{ secrets.WISPBYTE_EMAIL }}
          WISPBYTE_PASSWORD: ${{ secrets.WISPBYTE_PASSWORD }}
        run: |
          python wispbyte_login.py

      # 可选报警
      - name: Telegram 报警（失败时）
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="Wispbyte 保活失败！$(date)"

      # 成功后上传 cookie 文件作为 artifact（方便你随时下载查看）
      - name: 上传 cookie 文件（方便调试）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wispbyte-cookies
          path: wispbyte_cookies.json
