name: Wispbyte 永久保活

on:
  schedule:
    - cron: '0 */4 * * *'   # 每 4 小时一次，彻底杜绝过期
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & Chrome
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y chromium-browser
          pip install selenium requests

      - name: Run Wispbyte 保活
        env:
          WISPBYTE_EMAIL: ${{ secrets.WISPBYTE_EMAIL }}
          WISPBYTE_PASSWORD: ${{ secrets.WISPBYTE_PASSWORD }}
        run: python wispbyte_login.py
