name: Wispbyte 保活 (Cookie版)

on:
  schedule:
    - cron: '0 2 * * *'      # 每天运行一次即可，无需太频繁
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 执行保活
        env:
          # 只需要 Cookie 和 代理
          WISPBYTE_COOKIE_STRING: ${{ secrets.WISPBYTE_COOKIE_STRING }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
        run: python wispbyte_login.py

      - name: Telegram 报警
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Wispbyte 保活失败！Cookie 可能已过期，请手动更新 Secrets。"
